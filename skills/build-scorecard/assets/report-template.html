<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engineering report</title>
<!--
  SEI OS report template. Self-contained: no external scripts, fonts or images,
  so the report can be opened offline and customer data never leaves the machine.
  Fill the JSON block below (see report-schema.md) or run:
    python3 scripts/render_report.py report-data.json report.html
-->
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --ring: rgba(11,11,11,0.10);
  --accent: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --delta-good: #006300; --delta-bad: #b42c2c;
  --wash: rgba(42,120,214,0.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7;
    --muted: #898781; --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --delta-good: #0ca30c; --delta-bad: #e66767; --wash: rgba(57,135,229,0.12);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7;
  --muted: #898781; --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
  --accent: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --delta-good: #0ca30c; --delta-bad: #e66767; --wash: rgba(57,135,229,0.12);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 980px; margin: 0 auto; padding: 40px 16px 64px; }
header.report { margin-bottom: 28px; }
.eyebrow { color: var(--muted); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 6px; }
h1 { font-size: 30px; line-height: 1.2; margin: 0 0 6px; font-weight: 650; letter-spacing: -.01em; }
.subtitle { color: var(--ink-2); margin: 0; font-size: 16px; }
.scope { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 14px; color: var(--ink-2); font-size: 13px; }
.scope b { color: var(--ink); font-weight: 600; }
.theme-toggle { float: right; border: 1px solid var(--ring); background: var(--surface); color: var(--ink-2); border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 20px 22px; margin: 0 0 18px; }
.summary h2, section > h2 { font-size: 19px; margin: 0 0 10px; font-weight: 620; }
.summary ol, .summary ul { margin: 0; padding-left: 20px; }
.summary li { margin: 4px 0; }
.decision { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; margin: 14px 0 0; color: var(--ink); }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin: 0 0 18px; }
.kpi { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 14px 16px; }
.kpi .label { color: var(--ink-2); font-size: 13px; }
.kpi .value { font-size: 28px; font-weight: 620; margin: 2px 0; letter-spacing: -.01em; }
.kpi .value small { font-size: 14px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
.kpi .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.delta.up-good, .delta.down-good { color: var(--delta-good); }
.delta.up-bad, .delta.down-bad { color: var(--delta-bad); }
.delta.flat { color: var(--muted); }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.status i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.status.great i { background: var(--good); }
.status.good i { background: transparent; border: 2px solid var(--good); width: 10px; height: 10px; }
.status.attention i { background: var(--critical); }
.status.unknown i { background: transparent; border: 1.5px solid var(--muted); }
section { margin: 28px 0 0; }
section > .body p { margin: 0 0 10px; color: var(--ink); }
section > .body ul { margin: 0 0 10px; padding-left: 20px; }
a { color: var(--accent); }
.chart { margin: 14px 0 4px; }
.chart h3 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
.chart .caption { color: var(--ink-2); font-size: 13px; margin: 0 0 10px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart svg text { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
.chart svg text.muted { fill: var(--muted); }
.chart svg text.ink { fill: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); margin: 0 0 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.chart-tools { display: flex; justify-content: flex-end; }
.chart-tools button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; padding: 2px 0; }
.chart-tools button:hover { color: var(--ink); }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; margin: 6px 0 0; }
table.data th, table.data td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
table.data th { color: var(--ink-2); font-weight: 600; font-size: 12px; }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
.scorecard { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.pillar { border: 1px solid var(--ring); border-radius: 10px; padding: 14px; background: var(--page); }
.pillar h4 { margin: 0; font-size: 15px; }
.pillar .q { color: var(--ink-2); font-size: 12.5px; margin: 2px 0 10px; }
.group { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 0; border-top: 1px solid var(--grid); }
.group .name { font-weight: 560; font-size: 13.5px; }
.group .headline { grid-column: 1 / -1; color: var(--ink-2); font-size: 12.5px; }
.method { color: var(--ink-2); font-size: 13px; }
.method h2 { color: var(--ink); font-size: 16px; }
.method ul { padding-left: 18px; margin: 4px 0 10px; }
#tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--ink); border: 1px solid var(--ring); box-shadow: 0 4px 16px rgba(0,0,0,.12); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; max-width: 280px; opacity: 0; transition: opacity .08s; }
#tip b { font-weight: 600; }
#tip .row { display: flex; align-items: center; gap: 6px; }
#tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
footer { color: var(--muted); font-size: 12px; margin-top: 36px; }
@media print { .theme-toggle, .chart-tools { display: none; } body { background: #fff; } .card, .kpi { break-inside: avoid; } }
</style>
</head>
<body>
<main id="app"></main>
<div id="tip" role="tooltip"></div>

<script type="application/json" id="report-data">
/*__REPORT_DATA__*/
</script>

<script>
(function () {
  "use strict";
  var raw = document.getElementById("report-data").textContent.trim();
  if (/^\/\*__REPORT_[A-Z]+__\*\/$/.test(raw)) raw = ""; // unfilled template
  var R;
  try { R = raw ? JSON.parse(raw) : null; } catch (e) { R = { title: "Report data is not valid JSON", summary: [String(e)] }; }
  if (!R) R = { title: "Empty report", summary: ["Fill the report-data block or run render_report.py."] };

  var SERIES = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7", "--s8"];
  var STATUS_LABEL = { great: "Great", good: "Good", attention: "Needs attention", unknown: "No data" };
  var app = document.getElementById("app");
  var tip = document.getElementById("tip");
  var NS = "http://www.w3.org/2000/svg";

  function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function color(i) { return "var(" + SERIES[i % SERIES.length] + ")"; }
  function inkOn(i) {
    // White or ink text inside a filled segment, chosen by the fill's luminance.
    var hex = css(SERIES[i % SERIES.length]).replace("#", "");
    if (hex.length !== 6) return "#fff";
    var ch = [0, 2, 4].map(function (k) { var c = parseInt(hex.substr(k, 2), 16) / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); });
    var L = 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
    return (1.05 / (L + 0.05)) >= 4.5 ? "#fff" : "#0b0b0b";
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function md(s) {
    // Markdown-lite: paragraphs, "- " bullets, **bold**, _em_, `code`, [text](https://url)
    var blocks = String(s || "").split(/\n\s*\n/);
    return blocks.map(function (b) {
      var lines = b.split("\n");
      var inline = function (t) {
        return esc(t)
          .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
          .replace(/(^|\W)_(.+?)_(?=\W|$)/g, "$1<em>$2</em>")
          .replace(/`(.+?)`/g, "<code>$1</code>")
          .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      };
      if (lines.every(function (l) { return /^\s*[-*] /.test(l); })) {
        return "<ul>" + lines.map(function (l) { return "<li>" + inline(l.replace(/^\s*[-*] /, "")) + "</li>"; }).join("") + "</ul>";
      }
      return "<p>" + inline(lines.join(" ")) + "</p>";
    }).join("");
  }
  function el(tag, attrs, html) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    if (html != null) n.innerHTML = html;
    return n;
  }
  function svg(tag, attrs) {
    var n = document.createElementNS(NS, tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    return n;
  }

  // ---------- number formatting ----------
  function compact(n) {
    var a = Math.abs(n);
    if (a >= 1e9) return (n / 1e9).toFixed(a >= 1e10 ? 0 : 1).replace(/\.0$/, "") + "B";
    if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(/\.0$/, "") + "M";
    if (a >= 1e3) return (n / 1e3).toFixed(a >= 1e4 ? 0 : 1).replace(/\.0$/, "") + "K";
    if (a === 0) return "0";
    if (a < 1) return n.toFixed(2).replace(/0$/, "");
    if (a < 10) return n.toFixed(1).replace(/\.0$/, "");
    return Math.round(n).toString();
  }
  function fmt(v, unit) {
    if (v == null || v === "" || (typeof v === "number" && isNaN(v))) return "–";
    if (typeof v !== "number") return String(v);
    switch (unit) {
      case "%": return (Math.abs(v) < 10 ? v.toFixed(1).replace(/\.0$/, "") : Math.round(v)) + "%";
      case "h": return compact(v) + " h";
      case "d": return compact(v) + " d";
      case "min": return compact(v) + " min";
      case "s": return humanDuration(v);
      case "$": return "$" + compact(v);
      case "€": return "€" + compact(v);
      case "": case undefined: case null: return compact(v);
      default: return compact(v) + " " + unit;
    }
  }
  function humanDuration(sec) {
    var h = sec / 3600;
    if (sec < 60) return Math.round(sec) + " s";
    if (h < 1) return Math.round(sec / 60) + " min";
    if (h < 48) return (h < 10 ? h.toFixed(1).replace(/\.0$/, "") : Math.round(h)) + " h";
    return (h / 24).toFixed(1).replace(/\.0$/, "") + " d";
  }
  function niceMax(v) {
    if (v <= 0) return 1;
    var p = Math.pow(10, Math.floor(Math.log10(v))), m = v / p;
    var n = m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10;
    return n * p;
  }
  function ticks(max, count) {
    // Round tick steps (1, 2, 2.5, 5 × 10^n) so axes read 0 / 10 / 20, never 0 / 12.5 / 25.
    var raw = max / count, p = Math.pow(10, Math.floor(Math.log10(raw || 1))), m = raw / p;
    var step = (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
    var out = [];
    for (var v = 0; v <= max + step * 1e-9; v += step) out.push(v);
    return out;
  }
  function exact(v, unit) {
    // Table cells show the precise value: thousands separators, up to one decimal.
    if (typeof v !== "number") return fmt(v, unit);
    if (unit === "s") return humanDuration(v);
    var a = Math.abs(v);
    var n = a >= 100 ? Math.round(v).toLocaleString("en-US")
      : a >= 10 ? (Math.round(v * 10) / 10).toLocaleString("en-US")
      : (Math.round(v * 100) / 100).toLocaleString("en-US");
    if (unit === "%" || unit === "×" || unit === "x") return n + (unit === "x" ? "×" : unit);
    if (unit === "$" || unit === "€") return unit + n;
    return unit ? n + " " + unit : n;
  }

  // ---------- tooltip ----------
  function showTip(evt, html) {
    tip.innerHTML = html; tip.style.opacity = "1";
    var x = evt.clientX + 14, y = evt.clientY + 14, w = tip.offsetWidth, h = tip.offsetHeight;
    if (x + w > window.innerWidth - 8) x = evt.clientX - w - 14;
    if (y + h > window.innerHeight - 8) y = evt.clientY - h - 14;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  function hideTip() { tip.style.opacity = "0"; }
  function swatchRow(c, label, value) { return '<div class="row"><i style="background:' + c + '"></i>' + esc(label) + (value != null ? ": <b>" + esc(value) + "</b>" : "") + "</div>"; }

  // ---------- shared chart frame ----------
  function frame(spec, host) {
    var wrap = el("div", { class: "chart" });
    if (spec.title) wrap.appendChild(el("h3", null, esc(spec.title)));
    if (spec.caption) wrap.appendChild(el("p", { class: "caption" }, esc(spec.caption)));
    host.appendChild(wrap);
    return wrap;
  }
  function legend(wrap, names) {
    if (!names || names.length < 2) return;
    var lg = el("div", { class: "legend" });
    names.forEach(function (n, i) { lg.appendChild(el("span", null, '<i style="background:' + color(i) + '"></i>' + esc(n))); });
    wrap.appendChild(lg);
  }
  function tableToggle(wrap, columns, rows) {
    var tools = el("div", { class: "chart-tools" });
    var btn = el("button", { type: "button", "aria-expanded": "false" }, "Show table");
    var tw = el("div", { class: "table-wrap", hidden: "" });
    tw.appendChild(buildTable(columns, rows));
    btn.onclick = function () {
      var open = tw.hasAttribute("hidden");
      if (open) tw.removeAttribute("hidden"); else tw.setAttribute("hidden", "");
      btn.textContent = open ? "Hide table" : "Show table";
      btn.setAttribute("aria-expanded", String(open));
    };
    tools.appendChild(btn); wrap.appendChild(tools); wrap.appendChild(tw);
  }
  function buildTable(columns, rows) {
    var t = el("table", { class: "data" });
    var thead = "<thead><tr>" + columns.map(function (c) { return '<th class="' + (c.num ? "num" : "") + '">' + esc(c.label) + "</th>"; }).join("") + "</tr></thead>";
    var tbody = "<tbody>" + rows.map(function (r) {
      return "<tr>" + r.map(function (v, i) {
        var c = columns[i] || {};
        var cell = c.link && v && typeof v === "object" ? '<a href="' + esc(v.href) + '" target="_blank" rel="noopener">' + esc(v.text) + "</a>"
          : c.status ? statusChip(v)
          : esc(c.num && typeof v === "number" ? exact(v, c.unit) : v);
        return '<td class="' + (c.num ? "num" : "") + '">' + cell + "</td>";
      }).join("") + "</tr>";
    }).join("") + "</tbody>";
    t.innerHTML = thead + tbody;
    return t;
  }
  function statusChip(s) { if (!s) return ""; return '<span class="status ' + esc(s) + '"><i></i>' + esc(STATUS_LABEL[s] || s) + "</span>"; }
  function bandFor(v, bands, lowerIsBetter) {
    if (!bands || v == null) return null;
    if (lowerIsBetter) return v < bands.great ? "great" : v < bands.good ? "good" : "attention";
    return v >= bands.great ? "great" : v >= bands.good ? "good" : "attention";
  }

  // ---------- horizontal bar (magnitude per category, optional benchmark lines) ----------
  function barChart(spec, host) {
    var wrap = frame(spec, host);
    var data = spec.data || [], unit = spec.unit;
    var W = 760, labelW = Math.min(220, 40 + Math.max.apply(null, data.map(function (d) { return String(d.label).length; }).concat([4])) * 7);
    var barH = 18, gap = 12, top = 8, plotW = W - labelW - 70;
    var H = top + data.length * (barH + gap) + 24;
    var refs = (spec.bands ? [{ v: spec.bands.great, l: "Great" }, { v: spec.bands.good, l: "Good" }] : []).concat(spec.reference ? [spec.reference] : []);
    var max = niceMax(Math.max.apply(null, data.map(function (d) { return d.value || 0; }).concat(refs.map(function (r) { return r.v || r.value || 0; }))) * 1.05);
    var s = svg("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": spec.title || "Bar chart" });
    var x = function (v) { return labelW + (v / max) * plotW; };
    ticks(max, 4).forEach(function (t) {
      s.appendChild(svg("line", { x1: x(t), x2: x(t), y1: top - 4, y2: H - 20, stroke: "var(--grid)", "stroke-width": 1 }));
      var tx = svg("text", { x: x(t), y: H - 4, "text-anchor": "middle", class: "muted" }); tx.textContent = fmt(t, unit); s.appendChild(tx);
    });
    refs.forEach(function (r) {
      var v = r.v != null ? r.v : r.value;
      s.appendChild(svg("line", { x1: x(v), x2: x(v), y1: top - 6, y2: H - 20, stroke: "var(--axis)", "stroke-width": 1.5 }));
      var tx = svg("text", { x: x(v) + 4, y: top + 2, class: "muted" }); tx.textContent = (r.l || r.label) + " " + fmt(v, unit); s.appendChild(tx);
    });
    data.forEach(function (d, i) {
      var y = top + i * (barH + gap) + 6;
      var lab = svg("text", { x: labelW - 10, y: y + barH / 2 + 4, "text-anchor": "end", class: "ink" }); lab.textContent = d.label; s.appendChild(lab);
      var w = Math.max(2, x(d.value || 0) - labelW);
      var st = d.status || bandFor(d.value, spec.bands, spec.lowerIsBetter);
      var fill = d.highlight === false ? "var(--axis)" : spec.colorByStatus && st ? "var(--" + { great: "good", good: "warning", attention: "critical" }[st] + ")" : color(0);
      var r = Math.min(4, w / 2);
      var p = svg("path", { d: "M" + labelW + "," + y + "h" + (w - r) + "a" + r + "," + r + " 0 0 1 " + r + "," + r + "v" + (barH - 2 * r) + "a" + r + "," + r + " 0 0 1 -" + r + "," + r + "h-" + (w - r) + "z", fill: fill });
      s.appendChild(p);
      var val = svg("text", { x: labelW + w + 6, y: y + barH / 2 + 4, class: "ink" }); val.textContent = fmt(d.value, unit) + (st && spec.bands ? "  · " + STATUS_LABEL[st] : ""); s.appendChild(val);
      var hit = svg("rect", { x: 0, y: y - gap / 2, width: W, height: barH + gap, fill: "transparent" });
      hit.addEventListener("mousemove", function (e) { p.setAttribute("opacity", ".85"); showTip(e, "<b>" + esc(d.label) + "</b><br>" + esc(fmt(d.value, unit)) + (d.n != null ? " · n=" + esc(d.n) : "") + (d.note ? "<br>" + esc(d.note) : "")); });
      hit.addEventListener("mouseleave", function () { p.removeAttribute("opacity"); hideTip(); });
      s.appendChild(hit);
    });
    wrap.appendChild(s);
    tableToggle(wrap, [{ label: spec.categoryLabel || "" }, { label: spec.valueLabel || "Value", num: true, unit: unit }].concat(spec.bands ? [{ label: "Benchmark", status: true }] : []).concat(data.some(function (d) { return d.n != null; }) ? [{ label: "n", num: true }] : []),
      data.map(function (d) { var r = [d.label, d.value]; if (spec.bands) r.push(d.status || bandFor(d.value, spec.bands, spec.lowerIsBetter)); if (data.some(function (q) { return q.n != null; })) r.push(d.n); return r; }));
  }

  // ---------- stacked horizontal bars (composition per row) ----------
  function stackedChart(spec, host) {
    var wrap = frame(spec, host);
    var series = spec.series || [], rows = spec.rows || [], unit = spec.unit, pct = !!spec.percent;
    legend(wrap, series);
    var W = 760, labelW = Math.min(220, 40 + Math.max.apply(null, rows.map(function (r) { return String(r.label).length; }).concat([4])) * 7);
    var barH = 20, gap = 12, top = 4, plotW = W - labelW - 60;
    var H = top + rows.length * (barH + gap) + 22;
    var totals = rows.map(function (r) { return r.values.reduce(function (a, b) { return a + (b || 0); }, 0); });
    var max = pct ? 100 : niceMax(Math.max.apply(null, totals.concat([0])));
    var s = svg("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": spec.title || "Stacked bar chart" });
    var x = function (v) { return labelW + (v / max) * plotW; };
    ticks(max, 4).forEach(function (t) {
      s.appendChild(svg("line", { x1: x(t), x2: x(t), y1: 0, y2: H - 18, stroke: "var(--grid)", "stroke-width": 1 }));
      var tx = svg("text", { x: x(t), y: H - 3, "text-anchor": "middle", class: "muted" }); tx.textContent = pct ? Math.round(t) + "%" : fmt(t, unit); s.appendChild(tx);
    });
    rows.forEach(function (r, i) {
      var y = top + i * (barH + gap) + 4, acc = 0, total = totals[i] || 1;
      var lab = svg("text", { x: labelW - 10, y: y + barH / 2 + 4, "text-anchor": "end", class: "ink" }); lab.textContent = r.label; s.appendChild(lab);
      var segs = r.values.map(function (v) { return pct ? (v || 0) / total * 100 : (v || 0); });
      var lastIdx = -1; segs.forEach(function (v, j) { if (v > 0) lastIdx = j; });
      segs.forEach(function (v, j) {
        if (v <= 0) return;
        var x0 = x(acc), x1 = x(acc + v); acc += v;
        var w = Math.max(0, x1 - x0 - (j === lastIdx ? 0 : 2));
        var rad = j === lastIdx ? Math.min(4, w / 2) : 0;
        var p = svg("path", { d: "M" + x0 + "," + y + "h" + (w - rad) + (rad ? "a" + rad + "," + rad + " 0 0 1 " + rad + "," + rad + "v" + (barH - 2 * rad) + "a" + rad + "," + rad + " 0 0 1 -" + rad + "," + rad : "v" + barH) + "h-" + (w - rad) + "z", fill: color(j) });
        p.addEventListener("mousemove", function (e) {
          p.setAttribute("opacity", ".85");
          showTip(e, "<b>" + esc(r.label) + "</b>" + swatchRow(color(j), series[j], (pct ? fmt(v, "%") + " · " : "") + fmt(r.values[j], unit)));
        });
        p.addEventListener("mouseleave", function () { p.removeAttribute("opacity"); hideTip(); });
        s.appendChild(p);
        if (w > 44 && spec.labels !== false) {
          var t = svg("text", { x: x0 + w / 2, y: y + barH / 2 + 4, "text-anchor": "middle", style: "fill:" + inkOn(j) + ";font-weight:600;pointer-events:none" });
          t.textContent = pct ? Math.round(v) + "%" : fmt(v, unit); s.appendChild(t);
        }
      });
    });
    wrap.appendChild(s);
    tableToggle(wrap, [{ label: "" }].concat(series.map(function (n) { return { label: n, num: true, unit: unit }; })).concat(pct ? [] : [{ label: "Total", num: true, unit: unit }]),
      rows.map(function (r, i) { var row = [r.label].concat(r.values); if (!pct) row.push(totals[i]); return row; }));
  }

  // ---------- line (trend over time, one axis) ----------
  function lineChart(spec, host) {
    var wrap = frame(spec, host);
    var xs = spec.x || [], series = spec.series || [], unit = spec.unit;
    legend(wrap, series.map(function (s) { return s.name; }));
    var W = 760, H = 260, L = 52, Rr = 110, T = 12, B = 28, pw = W - L - Rr, ph = H - T - B;
    var all = []; series.forEach(function (s) { s.values.forEach(function (v) { if (v != null) all.push(v); }); });
    if (spec.reference) all.push(spec.reference.value);
    var max = niceMax(Math.max.apply(null, all.concat([0])) * 1.05), min = 0;
    var s = svg("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": spec.title || "Line chart" });
    var X = function (i) { return L + (xs.length < 2 ? pw / 2 : (i / (xs.length - 1)) * pw); };
    var Y = function (v) { return T + ph - ((v - min) / (max - min)) * ph; };
    ticks(max, 4).forEach(function (t) {
      s.appendChild(svg("line", { x1: L, x2: L + pw, y1: Y(t), y2: Y(t), stroke: t === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
      var tx = svg("text", { x: L - 8, y: Y(t) + 4, "text-anchor": "end", class: "muted" }); tx.textContent = fmt(t, unit); s.appendChild(tx);
    });
    var every = Math.ceil(xs.length / 8);
    xs.forEach(function (lab, i) { if (i % every && i !== xs.length - 1) return; var tx = svg("text", { x: X(i), y: H - 8, "text-anchor": "middle", class: "muted" }); tx.textContent = lab; s.appendChild(tx); });
    if (spec.reference) {
      s.appendChild(svg("line", { x1: L, x2: L + pw, y1: Y(spec.reference.value), y2: Y(spec.reference.value), stroke: "var(--axis)", "stroke-width": 1.5 }));
      var rt = svg("text", { x: L + pw + 6, y: Y(spec.reference.value) + 4, class: "muted" }); rt.textContent = spec.reference.label; s.appendChild(rt);
    }
    // End labels only when they cannot collide; otherwise the legend and tooltip carry identity.
    var ends = series.map(function (se) { var li = se.values.length - 1; while (li >= 0 && se.values[li] == null) li--; return li >= 0 ? Y(se.values[li]) : null; }).filter(function (y) { return y != null; }).sort(function (a, b) { return a - b; });
    var endLabels = series.length <= 4 && ends.every(function (y, i) { return i === 0 || y - ends[i - 1] >= 16; });
    series.forEach(function (se, k) {
      var d = "", started = false;
      se.values.forEach(function (v, i) { if (v == null) { started = false; return; } d += (started ? "L" : "M") + X(i) + "," + Y(v); started = true; });
      if (series.length === 1) {
        var area = d + "L" + X(se.values.length - 1) + "," + Y(0) + "L" + X(0) + "," + Y(0) + "Z";
        s.appendChild(svg("path", { d: area, fill: color(k), opacity: .1 }));
      }
      s.appendChild(svg("path", { d: d, fill: "none", stroke: color(k), "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
      var li = se.values.length - 1; while (li >= 0 && se.values[li] == null) li--;
      if (li >= 0) {
        s.appendChild(svg("circle", { cx: X(li), cy: Y(se.values[li]), r: 4.5, fill: color(k), stroke: "var(--surface)", "stroke-width": 2 }));
        if (endLabels) { var et = svg("text", { x: X(li) + 9, y: Y(se.values[li]) + 4, class: "ink" }); et.textContent = (series.length > 1 ? se.name + " " : "") + fmt(se.values[li], unit); s.appendChild(et); }
      }
    });
    var cross = svg("line", { y1: T, y2: T + ph, stroke: "var(--axis)", "stroke-width": 1, opacity: 0 }); s.appendChild(cross);
    var hit = svg("rect", { x: L, y: T, width: pw, height: ph, fill: "transparent" });
    hit.addEventListener("mousemove", function (e) {
      var box = s.getBoundingClientRect(), px = (e.clientX - box.left) * (W / box.width);
      var i = Math.max(0, Math.min(xs.length - 1, Math.round(((px - L) / pw) * (xs.length - 1))));
      cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.setAttribute("opacity", 1);
      showTip(e, "<b>" + esc(xs[i]) + "</b>" + series.map(function (se, k) { return swatchRow(color(k), se.name, fmt(se.values[i], unit)); }).join(""));
    });
    hit.addEventListener("mouseleave", function () { cross.setAttribute("opacity", 0); hideTip(); });
    s.appendChild(hit);
    wrap.appendChild(s);
    tableToggle(wrap, [{ label: spec.xLabel || "Period" }].concat(series.map(function (se) { return { label: se.name, num: true, unit: unit }; })),
      xs.map(function (lab, i) { return [lab].concat(series.map(function (se) { return se.values[i]; })); }));
  }

  // ---------- Build scorecard (3 pillars x metric groups, status + headline) ----------
  function scorecard(spec, host) {
    var wrap = frame(spec, host);
    var grid = el("div", { class: "scorecard" });
    (spec.pillars || []).forEach(function (p) {
      var card = el("div", { class: "pillar" });
      card.appendChild(el("h4", null, esc(p.name)));
      if (p.question) card.appendChild(el("p", { class: "q" }, esc(p.question)));
      (p.groups || []).forEach(function (g) {
        var row = el("div", { class: "group" });
        row.appendChild(el("div", { class: "name" }, esc(g.name)));
        row.appendChild(el("div", null, statusChip(g.status || "unknown")));
        if (g.headline) row.appendChild(el("div", { class: "headline" }, esc(g.headline)));
        card.appendChild(row);
      });
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
  }

  function tableChart(spec, host) {
    var wrap = frame(spec, host);
    var tw = el("div", { class: "table-wrap" });
    tw.appendChild(buildTable(spec.columns || [], spec.rows || []));
    wrap.appendChild(tw);
  }

  var RENDER = { bar: barChart, stacked: stackedChart, line: lineChart, scorecard: scorecard, table: tableChart };

  // ---------- page ----------
  document.title = R.title || "Engineering report";
  var head = el("header", { class: "report" });
  var toggle = el("button", { class: "theme-toggle", type: "button" }, "Theme");
  toggle.onclick = function () {
    var cur = document.documentElement.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  };
  head.appendChild(toggle);
  if (R.eyebrow) head.appendChild(el("p", { class: "eyebrow" }, esc(R.eyebrow)));
  head.appendChild(el("h1", null, esc(R.title || "Engineering report")));
  if (R.subtitle) head.appendChild(el("p", { class: "subtitle" }, esc(R.subtitle)));
  if (R.scope) {
    var sc = el("div", { class: "scope" });
    Object.keys(R.scope).forEach(function (k) { sc.appendChild(el("span", null, esc(k.charAt(0).toUpperCase() + k.slice(1)) + ": <b>" + esc(R.scope[k]) + "</b>")); });
    head.appendChild(sc);
  }
  app.appendChild(head);

  if (R.summary && R.summary.length) {
    var sum = el("div", { class: "card summary" });
    sum.appendChild(el("h2", null, esc(R.summaryTitle || "Summary")));
    sum.appendChild(el("ol", null, R.summary.map(function (s) { return "<li>" + md(s).replace(/^<p>|<\/p>$/g, "") + "</li>"; }).join("")));
    if (R.decision) sum.appendChild(el("p", { class: "decision" }, "<b>Decision:</b> " + esc(R.decision)));
    app.appendChild(sum);
  }

  if (R.kpis && R.kpis.length) {
    var kp = el("div", { class: "kpis" });
    R.kpis.forEach(function (k) {
      var d = "";
      if (k.delta != null) {
        var dir = k.deltaDirection || "flat";
        d = '<span class="delta ' + esc(dir) + '">' + esc(k.delta) + "</span>";
      }
      kp.appendChild(el("div", { class: "kpi" },
        '<div class="label">' + esc(k.label) + "</div>" +
        '<div class="value">' + esc(k.value) + (k.unit ? "<small>" + esc(k.unit) + "</small>" : "") + "</div>" +
        '<div class="meta">' + d + (k.status ? statusChip(k.status) : "") + (k.note ? "<span>" + esc(k.note) + "</span>" : "") + "</div>"));
    });
    app.appendChild(kp);
  }

  (R.sections || []).forEach(function (sec) {
    var s = el("section");
    var c = el("div", { class: "card" });
    if (sec.title) c.appendChild(el("h2", null, esc(sec.title)));
    if (sec.body) c.appendChild(el("div", { class: "body" }, md(sec.body)));
    (sec.charts || []).forEach(function (ch) { (RENDER[ch.type] || tableChart)(ch, c); });
    if (sec.after) c.appendChild(el("div", { class: "body" }, md(sec.after)));
    s.appendChild(c); app.appendChild(s);
  });

  if (R.method) {
    var m = el("section", { class: "card method" });
    m.appendChild(el("h2", null, "How this was calculated"));
    var parts = "";
    if (R.method.sources) parts += "<b>Sources</b><ul>" + R.method.sources.map(function (x) { return "<li>" + md(x).replace(/^<p>|<\/p>$/g, "") + "</li>"; }).join("") + "</ul>";
    if (R.method.caveats) parts += "<b>Caveats</b><ul>" + R.method.caveats.map(function (x) { return "<li>" + md(x).replace(/^<p>|<\/p>$/g, "") + "</li>"; }).join("") + "</ul>";
    if (R.method.links) parts += "<b>Open in Swarmia</b><ul>" + R.method.links.map(function (l) { return '<li><a href="' + esc(l.href) + '" target="_blank" rel="noopener">' + esc(l.text) + "</a></li>"; }).join("") + "</ul>";
    m.appendChild(el("div", null, parts));
    app.appendChild(m);
  }
  app.appendChild(el("footer", null, esc(R.footer || ("Generated " + (R.generatedAt || new Date().toISOString().slice(0, 10)) + " with SEI OS skills. Team-level metrics for continuous improvement, not individual evaluation."))));
})();
</script>
</body>
</html>
