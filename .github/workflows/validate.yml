name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skills, catalog, company rule book and shared-file sync
        run: python3 scripts/validate.py
      - name: Upstream only, company/ must stay templates
        if: github.repository == 'swarmia/sei-os'
        run: python3 scripts/validate.py --upstream
      - name: Render every example report
        run: |
          for f in examples/*.json; do
            python3 shared/scripts/render_report.py "$f" "/tmp/$(basename "$f" .json).html" --template shared/assets/report-template.html
          done
